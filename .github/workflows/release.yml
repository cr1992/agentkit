# 发布流水线。顺序严格遵循 AGENTS.md 的「发布」约定与
# docs/maintenance/source-of-truth.md 的第 4-6 步：
#   门禁 → npm 发布 → 从 registry 反装验证 → 才推 tag 和建 Release。
# 因此触发方式是手动 workflow_dispatch，而不是 tag push——tag push 会把顺序倒过来，
# 先产生 tag 再发布，一旦发布失败就留下一个指向未发布版本的 tag。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，须与 package.json 完全一致（例如 1.1.2）'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 门禁 Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: 只允许从 main 发布
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::只能从 main 发布，当前 ${GITHUB_REF}"; exit 1; }

      - name: 输入版本与 package.json 一致
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "${{ inputs.version }}" = "$pkg" || {
            echo "::error::输入 ${{ inputs.version }} 与 package.json $pkg 不一致"; exit 1; }

      - name: 该版本尚未发布
        run: |
          pkg="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "::error::$name@$pkg 已在 registry 上，拒绝重复发布"; exit 1
          fi

      - run: npm test
      - run: npm pack --dry-run

      # AGENTS.md：发布前「从生成的 tarball 做一次干净安装验证」。
      - name: 从 tarball 干净安装并自检
        run: |
          set -e
          tgz="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          npm i -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$tgz"
          "$RUNNER_TEMP/prefix/bin/agentkit" doctor

  publish:
    name: 发布到 npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # provenance 证明需要
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  attest:
    name: 从 registry 反装验证
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # AGENTS.md：「发布物必须能从 registry 反装并通过 agentkit doctor」。
      # registry 有传播延迟，反装前先等该精确版本可见。
      - name: 等待版本可见并反装自检
        run: |
          set -e
          for i in $(seq 1 30); do
            npm view "@cr1992/agentkit@${{ inputs.version }}" version >/dev/null 2>&1 && break
            echo "等待 registry 可见 ($i/30)"; sleep 10
          done
          npm i -g "@cr1992/agentkit@${{ inputs.version }}"
          agentkit doctor
          test "$(agentkit doctor | head -1 | awk '{print $2}')" = "${{ inputs.version }}"

  tag-and-release:
    name: 打 tag 并建 Release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Release 正文从 CHANGELOG 对应小节程序化提取，避免手抄漂移。
      - name: 提取 CHANGELOG 小节
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf(`## ${v} - `);
            if (start < 0) { console.error(`CHANGELOG 缺少 ## ${v} 小节`); process.exit(1); }
            const rest = text.slice(start);
            const nextIndex = rest.indexOf("\n## ", 1);
            const section = (nextIndex < 0 ? rest : rest.slice(0, nextIndex)).trim();
            fs.writeFileSync(
              "release-notes.md",
              `${section}\n\n安装或升级：\n\n\`\`\`bash\nnpm install -g @cr1992/agentkit@${v}\n\`\`\`\n`,
            );
          ' "${{ inputs.version }}"

      - name: 推 tag 并创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git tag -a "v${{ inputs.version }}" -m "agentkit v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" \
            --title "agentkit v${{ inputs.version }}" \
            --notes-file release-notes.md
