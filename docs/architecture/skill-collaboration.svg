<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent engineering skills selected and composed on demand</title>
  <desc id="desc">The controller selects one or more independent capabilities: sub-agent orchestration, Git worktree isolation, one-shot independent verification, or bounded implement-and-verify convergence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.controller-title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.controller-copy{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}.capability{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.skill-name{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}.copy{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.edge{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrow)}.contract-title{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1e3a8a}.contract-copy{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.legend{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <text class="title" x="60" y="57">Choose the capability the task actually needs</text>
  <text class="subtitle" x="60" y="86">Each Skill works independently. The controller owns routing, provider choice, and final authorization.</text>

  <g filter="url(#shadow)">
    <rect x="390" y="116" width="420" height="102" rx="18" fill="#1d4ed8"/>
    <text class="controller-title" x="600" y="154" text-anchor="middle">Controller / User Goal</text>
    <text class="controller-copy" x="600" y="182" text-anchor="middle">Freeze the contract · choose only the required providers</text>
  </g>

  <path class="edge" d="M600 218 L600 260"/>
  <text class="contract-title" x="600" y="273" text-anchor="middle">Independent capabilities · choose one or more</text>

  <g filter="url(#shadow)">
    <rect x="60" y="280" width="500" height="145" rx="16" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <rect x="60" y="280" width="500" height="8" rx="4" fill="#8b5cf6"/>
    <text class="capability" x="90" y="326">Multi-agent orchestration</text>
    <text class="skill-name" x="90" y="354">orchestrate-subagents</text>
    <text class="copy" x="90" y="386">Use for task graphs, parallel roles, barriers, and batch fuses.</text>
    <text class="copy" x="90" y="408">Skip when one agent can finish the task safely.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="280" width="500" height="145" rx="16" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <rect x="640" y="280" width="500" height="8" rx="4" fill="#16a34a"/>
    <text class="capability" x="670" y="326">Git write isolation</text>
    <text class="skill-name" x="670" y="354">manage-worktrees</text>
    <text class="copy" x="670" y="386">Use for concurrent writers, ownership tracking, and safe cleanup.</text>
    <text class="copy" x="670" y="408">Skip for read-only parallelism or a single writer.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="475" width="500" height="145" rx="16" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
    <rect x="60" y="475" width="500" height="8" rx="4" fill="#0284c7"/>
    <text class="capability" x="90" y="521">One-shot independent verification</text>
    <text class="skill-name" x="90" y="549">verify-agent-output</text>
    <text class="copy" x="90" y="581">Verify one frozen Artifact once and emit digest-bound Evidence.</text>
    <text class="copy" x="90" y="603">Failure stops; this Skill does not modify or retry the Artifact.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="475" width="500" height="145" rx="16" fill="#fff" stroke="#fb923c" stroke-width="2"/>
    <rect x="640" y="475" width="500" height="8" rx="4" fill="#ea580c"/>
    <text class="capability" x="670" y="521">Bounded implement–verify convergence</text>
    <text class="skill-name" x="670" y="549">run-agent-verify-loop</text>
    <text class="copy" x="670" y="581">Use only for explicit repeated implementation and independent review.</text>
    <text class="copy" x="670" y="603">Stops on pass, limits, fuses, aborts, or human gates.</text>
  </g>

  <g>
    <rect x="170" y="654" width="860" height="54" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="contract-title" x="600" y="677" text-anchor="middle">When combined, Skills exchange frozen, versioned envelopes</text>
    <text class="contract-copy" x="600" y="697" text-anchor="middle">Task Contract · Artifact Ref · Verification Profile · Evidence Package · Convergence Report</text>
  </g>
  <text class="legend" x="600" y="737" text-anchor="middle">Ordinary tasks may use none. The Loop is never the global entry point.</text>
</svg>
