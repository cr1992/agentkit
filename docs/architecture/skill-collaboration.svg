<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Agent engineering skills selected and composed on demand</title>
  <desc id="desc">The controller routes each request to independently usable skills. Orchestrate subagents owns multi-agent control and dynamically selects worker capability, execution mode, local model tier, and evidence-driven rerouting. Worktree, one-shot verification, and bounded loop providers compose through frozen envelopes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0f172a" flood-opacity="0.09"/></filter>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.controller-name{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.controller-copy{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}.name{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#172033}.role{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.copy{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.lane-title{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4c1d95}.lane-copy{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6d28d9}.step-title{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.step-copy{font:400 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.edge-purple{fill:none;stroke:#7c3aed;stroke-width:2.1;marker-end:url(#arrow-purple)}.label{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569;paint-order:stroke;stroke:#f6f8fb;stroke-width:6px;stroke-linejoin:round}.footer{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.pill{font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.65px}
    </style>
  </defs>

  <rect class="bg" width="1200" height="980" rx="28"/>
  <text class="title" x="60" y="55">Select capabilities by request facts, then compose only what is needed</text>
  <text class="subtitle" x="60" y="84">No skill is a universal entry point. The current controller keeps goal interpretation, provider choice, and final acceptance.</text>

  <g filter="url(#shadow)">
    <rect x="350" y="112" width="500" height="88" rx="18" fill="#2454d8"/>
    <text class="controller-name" x="600" y="148" text-anchor="middle">Controller / User Request</text>
    <text class="controller-copy" x="600" y="176" text-anchor="middle">interpret goal · discover live capabilities · freeze contract · accept result</text>
  </g>

  <path class="edge" d="M600 200 L600 237"/>
  <g filter="url(#shadow)">
    <rect x="245" y="237" width="710" height="82" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="role" x="600" y="270" text-anchor="middle">Route from observable task facts</text>
    <text class="copy" x="600" y="295" text-anchor="middle">multi-agent graph · Git isolation · one-shot independent review · explicit bounded convergence</text>
  </g>

  <path class="edge-purple" d="M400 319 L185 374"/>
  <path class="edge" d="M525 319 L455 374"/>
  <path class="edge" d="M675 319 L745 374"/>
  <path class="edge" d="M800 319 L1015 374"/>
  <text class="label" x="265" y="343">multi-agent / parallel</text>
  <text class="label" x="429" y="347">isolate writes</text>
  <text class="label" x="755" y="347">review once</text>
  <text class="label" x="933" y="343">explicit loop</text>

  <g filter="url(#shadow)">
    <rect x="55" y="374" width="260" height="126" rx="16" fill="#fff" stroke="#c4b5fd" stroke-width="1.6"/>
    <rect x="55" y="374" width="260" height="8" rx="4" fill="#8b5cf6"/>
    <rect x="78" y="398" width="94" height="21" rx="10.5" fill="#f3e8ff"/>
    <text class="pill" x="125" y="412" text-anchor="middle" fill="#7e22ce">CONTROL PLANE</text>
    <text class="name" x="78" y="448">orchestrate-subagents</text>
    <text class="role" x="78" y="474">task graph · dispatch · global acceptance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="374" width="220" height="126" rx="16" fill="#fff" stroke="#86efac" stroke-width="1.6"/>
    <rect x="350" y="374" width="220" height="8" rx="4" fill="#16a34a"/>
    <rect x="373" y="398" width="91" height="21" rx="10.5" fill="#dcfce7"/>
    <text class="pill" x="418.5" y="412" text-anchor="middle" fill="#15803d">GIT ISOLATION</text>
    <text class="name" x="373" y="448">manage-worktrees</text>
    <text class="role" x="373" y="474">owner · Artifact Ref · lifecycle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="615" y="374" width="250" height="126" rx="16" fill="#fff" stroke="#7dd3fc" stroke-width="1.6"/>
    <rect x="615" y="374" width="250" height="8" rx="4" fill="#0284c7"/>
    <rect x="638" y="398" width="114" height="21" rx="10.5" fill="#e0f2fe"/>
    <text class="pill" x="695" y="412" text-anchor="middle" fill="#0369a1">INDEPENDENT ONCE</text>
    <text class="name" x="638" y="448">verify-agent-output</text>
    <text class="role" x="638" y="474">frozen Artifact · Evidence Package</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="374" width="235" height="126" rx="16" fill="#fff" stroke="#fdba74" stroke-width="1.6"/>
    <rect x="910" y="374" width="235" height="8" rx="4" fill="#f97316"/>
    <rect x="933" y="398" width="105" height="21" rx="10.5" fill="#ffedd5"/>
    <text class="pill" x="985.5" y="412" text-anchor="middle" fill="#c2410c">BOUNDED LOOP</text>
    <text class="name" x="933" y="448">run-agent-verify-loop</text>
    <text class="role" x="933" y="474">implement ↔ verify · fuse / wait / stop</text>
  </g>

  <path class="edge-purple" d="M185 500 L185 545"/>
  <g filter="url(#shadow)">
    <rect x="55" y="545" width="1090" height="222" rx="18" fill="#faf7ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text class="lane-title" x="82" y="579">Inside orchestrate-subagents: capability-safe, locally configured dynamic dispatch</text>
    <text class="lane-copy" x="82" y="602">The strongest suitable controller chooses; workers do not self-select the next model.</text>

    <g>
      <rect x="82" y="629" width="220" height="88" rx="13" fill="#fff" stroke="#ddd6fe"/>
      <text class="step-title" x="102" y="659">1 · Effective capability</text>
      <text class="step-copy" x="102" y="682">requirements + live interface facts</text>
      <text class="step-copy" x="102" y="700">unknown / denied stays unavailable</text>
    </g>
    <g>
      <rect x="330" y="629" width="210" height="88" rx="13" fill="#fff" stroke="#ddd6fe"/>
      <text class="step-title" x="350" y="659">2 · Mode gate</text>
      <text class="step-copy" x="350" y="682">lightweight snapshot</text>
      <text class="step-copy" x="350" y="700">or full ledger + recovery</text>
    </g>
    <g>
      <rect x="568" y="629" width="245" height="88" rx="13" fill="#fff" stroke="#ddd6fe"/>
      <text class="step-title" x="588" y="659">3 · Local model policy</text>
      <text class="step-copy" x="588" y="682">tier · exact model · effort envelope</text>
      <text class="step-copy" x="588" y="700">user config + current host schema</text>
    </g>
    <g>
      <rect x="841" y="629" width="276" height="88" rx="13" fill="#fff" stroke="#ddd6fe"/>
      <text class="step-title" x="861" y="659">4 · Dispatch, verify, adjust</text>
      <text class="step-copy" x="861" y="682">bind attempt lineage + stable failure evidence</text>
      <text class="step-copy" x="861" y="700">retry / effort / model / tier / context / strategy</text>
    </g>

    <path class="edge-purple" d="M302 673 L330 673"/>
    <path class="edge-purple" d="M540 673 L568 673"/>
    <path class="edge-purple" d="M813 673 L841 673"/>
    <path class="edge-purple" d="M1080 629 C1070 600 790 602 730 628"/>
    <text class="label" x="1100" y="611" text-anchor="end">reroute only inside the confirmed envelope</text>
    <text class="copy" x="1117" y="743" text-anchor="end">non-reroutable failures → diagnose / re-contract / stop / escalate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="105" y="810" width="990" height="100" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text class="role" x="135" y="842">Frozen envelopes compose providers without transferring ownership</text>
    <text class="copy" x="135" y="870">manage-worktrees ── artifact_ref / isolation binding ──▶ verify-agent-output or run-agent-verify-loop</text>
    <text class="copy" x="135" y="893">verify-agent-output ── evidence_package ──▶ controller, orchestrator, or an explicitly selected Loop</text>
  </g>

  <line x1="60" y1="940" x2="1140" y2="940" stroke="#dbe2ea"/>
  <text class="footer" x="60" y="965">Each skill also works independently. Full mode adds control-plane durability; it never grants a worker extra capability.</text>
</svg>
